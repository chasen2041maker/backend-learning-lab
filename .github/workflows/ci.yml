name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-repo.lock
      - run: python -m pip install --requirement requirements-repo.lock
      - run: python -m pip install --no-deps --editable exercises/python-ticket-api
      - name: Format and lint
        run: |
          ruff format --check exercises/python-ticket-api exercises/redis-lab exercises/reliability-labs scripts
          ruff check exercises/python-ticket-api exercises/redis-lab exercises/reliability-labs scripts
      - run: pytest
        working-directory: exercises/python-ticket-api
      - run: python -m unittest discover -s exercises/reliability-labs/tests -v
      - run: python -m unittest discover -s exercises/redis-lab/tests -v

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercises/go-ticket-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: exercises/go-ticket-api/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-repo.lock
      - run: python -m pip install --requirement requirements-repo.lock
      - run: python scripts/validate_contracts.py
      - run: python scripts/check_markdown_links.py
      - run: python scripts/scan_secrets.py
      - name: Validate Compose and PostgreSQL schema
        run: |
          set -euo pipefail
          trap 'docker compose -f exercises/infrastructure/docker-compose.yml down -v' EXIT
          docker compose -f exercises/infrastructure/docker-compose.yml config --quiet
          docker compose -f exercises/infrastructure/docker-compose.yml up -d --wait postgres redis
          docker compose -f exercises/infrastructure/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U lab -d backend_lab -f /workspace/schema.sql
          docker compose -f exercises/infrastructure/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U lab -d backend_lab -f /workspace/seed.sql
          docker compose -f exercises/infrastructure/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U lab -d backend_lab -f /workspace/tests/outbox-integration.sql
          python exercises/redis-lab/stream_demo.py produce
          python exercises/redis-lab/stream_demo.py consume-crash
          python exercises/redis-lab/stream_demo.py pending
          python exercises/redis-lab/stream_demo.py reclaim
          python exercises/redis-lab/stream_demo.py pending | grep '"pending": 0'
          python -m unittest discover -s exercises/redis-lab/tests -v
          docker compose -f exercises/infrastructure/docker-compose.yml exec -T redis redis-cli FLUSHDB
          python exercises/redis-lab/stream_demo.py produce-invalid
          python exercises/redis-lab/stream_demo.py consume
          test "$(docker compose -f exercises/infrastructure/docker-compose.yml exec -T redis redis-cli XLEN lab:events:dlq | tr -d '\r')" = "1"
          test "$(docker compose -f exercises/infrastructure/docker-compose.yml exec -T redis redis-cli XPENDING lab:events lab-consumers | head -n 1 | tr -d '\r')" = "0"
          test "$(docker compose -f exercises/infrastructure/docker-compose.yml exec -T redis redis-cli --scan --pattern 'lab:processed:*' | wc -l)" = "0"
      - name: Build and smoke test pinned learning image
        run: |
          set -euo pipefail
          trap 'docker rm -f backend-learning-metrics-smoke >/dev/null 2>&1 || true' EXIT
          docker build --tag backend-learning-metrics:0.1.0 exercises/reliability-labs
          docker run --detach --name backend-learning-metrics-smoke \
            --publish 127.0.0.1:8081:8081 backend-learning-metrics:0.1.0
          ready=false
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8081/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8081/ready
          curl --fail --silent http://127.0.0.1:8081/metrics | grep 'lab_http_requests_total'
